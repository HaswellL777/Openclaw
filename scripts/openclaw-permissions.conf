# /etc/tmpfiles.d/openclaw-permissions.conf
# Persist group-read permissions on OpenClaw directories after gateway restart.
# The openclaw-gateway service resets these to 0700 on start; nick needs
# group-read (0750) via the openclaw group to access runs.json.
#
# Type Path                                      Mode User     Group     Age
z      /var/lib/openclaw/.openclaw/               0750 openclaw openclaw  -
z      /var/lib/openclaw/.openclaw/subagents/     0750 openclaw openclaw  -
